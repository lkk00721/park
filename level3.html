<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDGs 性別平權小達人 — 學習證書</title>
  <style>
    :root{ --ink:#1f2937; --muted:#6b7280; --brand:#2563eb; --gold:#eab308; --paper:#fff; --border:#d1d5db; }
    *{ box-sizing:border-box }
    body{ margin:0; font-family: "Noto Serif TC", ui-serif, Georgia, "Times New Roman", serif; color:var(--ink); background:#f5f7fb }

    header{ display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; background:#ffffffcc; backdrop-filter: blur(4px); border-bottom:1px solid #e5e7eb }
    .controls{ display:flex; gap:10px; align-items:center; font-family: system-ui, -apple-system, "Noto Sans TC", Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    input[type="text"]{ padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:min(320px, 60vw); font-size:16px }
    button{ padding:10px 14px; border:none; border-radius:10px; font-weight:800; cursor:pointer; background:var(--brand); color:#fff }
    .hint{ color:var(--muted); font-size:13px }

    /* 可列印的 A4 證書區塊 */
    .sheet-wrap{ display:grid; place-items:center; padding:20px }
    .sheet{ width:210mm; height:297mm; background:var(--paper); color:var(--ink); box-shadow:0 12px 40px #00000033; position:relative; overflow:hidden; }

    /* 裝飾邊框 */
    .sheet::before, .sheet::after{ content:""; position:absolute; inset:18mm; border:2px solid var(--border); border-radius:8mm }
    .sheet::after{ inset:12mm; border-color:#c4cbd6 }

    .logo{ position:absolute; top:20mm; left:0; right:0; text-align:center; font-size:14px; letter-spacing:2px; color:#475569; font-family: system-ui, -apple-system, "Noto Sans TC", Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .badge{ position:absolute; top:34mm; left:0; right:0; text-align:center; }
    .badge .ring{ display:inline-block; padding:10px 16px; border:3px solid var(--gold); border-radius:999px; color:#a16207; font-weight:900; background:#fffdf3 }

    .title{ position:absolute; top:58mm; left:0; right:0; text-align:center; font-size:30px; font-weight:900; letter-spacing:2px }

    .name-block{ position:absolute; top:95mm; left:0; right:0; text-align:center; }
    .name-label{ font-size:14px; color:#64748b; letter-spacing:1px }
    .name-line{ margin:8px auto 0; width:150mm; border-bottom:2px solid #cbd5e1; height:34px; }
    .name-text{ position:absolute; left:50%; transform:translateX(-50%); top:108mm; font-size:28px; font-weight:800; min-width:120px }

    .body{ position:absolute; top:132mm; left:28mm; right:28mm; text-align:center; line-height:1.8; font-size:15px }

    .meta{ position:absolute; bottom:44mm; left:28mm; right:28mm; display:flex; justify-content:space-between; align-items:flex-end; font-family: system-ui, -apple-system, "Noto Sans TC", Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .sign{ text-align:center }
    .sign .line{ width:60mm; border-bottom:2px solid #94a3b8; height:28px; margin:0 auto 6px }
    .seal{ text-align:center; border:3px solid var(--gold); color:#a16207; padding:8px 14px; border-radius:12px; font-weight:900; background:#fffdf3 }

    .foot{ position:absolute; bottom:22mm; left:0; right:0; text-align:center; font-size:11px; color:#94a3b8 }

    /* 列印優化：隱藏操作列、去除陰影、置中單頁 */
    @media print {
      @page { size: A4 portrait; margin: 0; }
      header, .hint { display: none !important; }
      body { background: #fff; }
      .sheet-wrap { padding: 0; }
      .sheet { width: 210mm; height: 297mm; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:900">SDGs 性別平權 — 學習證書</div>
    <div class="controls">
      <label for="nameInput" class="hint">請輸入姓名：</label>
      <input id="nameInput" type="text" placeholder="例如：王小明" maxlength="30" />
      <button id="printBtn">下載 / 列印</button>
    </div>
  </header>

  <main class="sheet-wrap">
    <section class="sheet" id="sheet">
      <div class="logo">SUSTAINABLE DEVELOPMENT GOALS · GOAL 5</div>
      <div class="badge"><span class="ring">SDGs 性別平權小達人</span></div>
      <div class="title">學 習 證 書</div>

      <div class="name-block">
        <div class="name-label">此證書頒發予</div>
        <div class="name-line"></div>
      </div>
      <div class="name-text" id="nameText">（請輸入姓名）</div>

      <div class="body">
        恭喜完成「SDGs 性別平權」學習任務，展現對性別平等的知識與實踐能力。<br/>
        本證書以茲證明其已具備辨識性別偏見、促進友善環境之基礎素養，
        期許未來持續推動尊重、包容與平等的價值。
      </div>

      <div class="meta">
        <div class="sign">
          <div class="line"></div>
          <div>授證單位 / Instructor</div>
        </div>
        <div class="seal">
          授證日期
          <div id="dateText" style="font-weight:700; margin-top:4px"></div>
        </div>
      </div>

      <div class="foot">若需電子存檔，請點選「下載 / 列印」並選擇另存 PDF。</div>
    </section>
  </main>

  <script>
    const NAME_KEY = 'sdg5_cert_name';
    const nameInput = document.getElementById('nameInput');
    const nameText  = document.getElementById('nameText');
    const printBtn  = document.getElementById('printBtn');
    const dateText  = document.getElementById('dateText');

    // 設定授證日期（今日）
    (function setToday(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      dateText.textContent = `${yyyy}-${mm}-${dd}`;
    })();

    // 從 localStorage 載入姓名（若有）
    const saved = localStorage.getItem(NAME_KEY);
    if(saved){ nameInput.value = saved; nameText.textContent = saved; }

    // 輸入即時更新 & 保存
    nameInput.addEventListener('input', () => {
      const v = nameInput.value.trim();
      nameText.textContent = v || '（請輸入姓名）';
      localStorage.setItem(NAME_KEY, v);
    });

    // 列印 / 下載：確保列印時使用者輸入的姓名已載入到證書上
    function syncNameBeforePrint(){
      const v = (nameInput.value || '').trim();
      if(!v){ alert('請先輸入姓名，將會顯示在證書上'); nameInput.focus(); return false; }
      nameText.textContent = v; // 保險同步
      localStorage.setItem(NAME_KEY, v);
      return true;
    }

    // 點擊按鈕觸發列印
    printBtn.addEventListener('click', () => {
      if(!syncNameBeforePrint()) return;
      window.print();
    });

    // 若使用者使用瀏覽器的列印快捷鍵，也自動同步
    window.addEventListener('beforeprint', syncNameBeforePrint);
  </script>
</body>
</html>
